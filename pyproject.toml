[project]
name = "claude-code-audio-recap"
version = "0.2.0"
description = "Audio Recap — a Claude Code plugin that listens to each assistant turn: a one-sentence recap of what Claude did, then the message itself, with long replies summarized for ears."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Leonid Bakaleynik" }]
keywords = ["claude-code", "plugin", "tts", "audio", "recap", "accessibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
homepage = "https://github.com/leonidb/claude-code-audio-recap"
repository = "https://github.com/leonidb/claude-code-audio-recap"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "ty>=0.0.1a5",
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout — the package lives at the repo root, not under src/.
module-root = ""
module-name = "audio_recap"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".claude-plugin", "tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.ty]
# Strict typing: fail the check on any unresolved reference, missing annotation,
# or incompatible assignment. Defaults are already close to strict for a fresh
# codebase with no Any leakage; explicit settings can be added as the codebase
# grows.

[tool.ty.environment]
python-version = "3.9"

[tool.ty.src]
include = ["audio_recap", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
